<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DinnerRush">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<script type="module" src="/auth.js"></script>

<title>DinnerRush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a restaurant operations console — calm, exact, for a manager planning the week
   IDEA: an architect's floor plan with live service overlaid, and an ops ledger beneath it
   PICTURE: the plan view — tables with service-progress rings, guests as dots, staff as initialled markers
   COLOUR and TYPE: white and graphite, one deep teal accent, LOW blue / MODERATE ochre / BUSY brick; Inter + Noto Sans HK
   LAYOUT: header ledger of figures, plan + control panel, scenarios, insight report, forecasts, roster */
:root{color-scheme:light dark;--bg:light-dark(#f5f6f7,#111417);--ink:light-dark(#15181c,#e8ebee);--mut:light-dark(#5d6873,#9ba7b2);--card:light-dark(#fff,#191d21);--line:light-dark(#e2e5e9,#2a3037);--soft:light-dark(#f0f2f4,#20262c);--brand:#0b5d63;--brand2:light-dark(#0b5d63,#6cc6cc);--low:#4a86b5;--mod:#c98f22;--busy:#c2483b;--off:light-dark(#aab2ba,#4b545d);--good:light-dark(#2f7d5b,#62c294)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Noto Sans HK",system-ui,sans-serif;overflow-x:clip;font-feature-settings:"tnum" 1}
.band{padding:clamp(18px,2.6vw,36px) max(4vw,14px)}
.top{background:var(--card);border-bottom:1px solid var(--line);padding-bottom:0;padding-top:max(clamp(18px,2.6vw,36px),env(safe-area-inset-top))}
body{padding-bottom:env(safe-area-inset-bottom)}
.tophead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.brandmark{display:flex;align-items:center;gap:10px}
.brandmark i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:inline-block;position:relative;flex:none}
.brandmark i::after{content:"";position:absolute;inset:8px;border:2px solid #fff;border-radius:50%}
.top h1{font:700 clamp(26px,3.4vw,36px)/1.1 Inter,"Noto Sans HK",sans-serif;margin:0;letter-spacing:-.01em}
.top p{margin:6px 0 0;color:var(--mut);font-size:14px;max-width:80ch}
.scope{display:inline-block;margin-top:10px;background:var(--soft);border-radius:6px;padding:3px 10px;font-size:13px;color:var(--mut)}
.lang{flex:none}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:16px;border-top:1px solid var(--line)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:12px 14px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi:first-child{padding-left:0}
.kpi b{display:block;font:600 clamp(20px,2.4vw,26px)/1.15 Inter,"Noto Sans HK",sans-serif;white-space:nowrap;letter-spacing:-.01em}
.kpi span{font-size:12.5px;color:var(--mut)}
.wrap{max-width:1240px;margin:0 auto}
.main{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
@media(max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.hud{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:2px 2px 10px}
.clock{font:600 26px/1 Inter,sans-serif;white-space:nowrap;margin-right:6px;letter-spacing:-.02em}
.badge{color:#fff;border-radius:5px;padding:3px 9px;font-weight:600;font-size:12px;white-space:nowrap;letter-spacing:.02em}
.chip{background:var(--soft);border-radius:5px;padding:3px 9px;font-size:13px;white-space:nowrap;color:var(--mut)}
.hud .sm{min-height:32px;font-size:13px;margin-left:auto}
.cvbox{position:relative;width:100%;aspect-ratio:800/520;border-radius:6px;overflow:hidden;touch-action:none;border:1px solid var(--line)}
.cvbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cvlegend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:8px}
.cvlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.ctrl{display:flex;gap:8px;align-items:center;padding-top:10px;flex-wrap:wrap}
.ctrl input[type=range]{flex:1 1 100%}
button,select,input,textarea{font:inherit;font-size:16px;color:inherit}
button{min-height:44px;border-radius:7px;border:1px solid var(--line);background:var(--card);padding:0 14px;cursor:pointer;font-size:14px;font-weight:500}
button:hover:not(:disabled){border-color:var(--mut)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
.pri{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.ff{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:600}
select,input[type=text],input[type=time],input[type=number],input[type=date],textarea{min-height:44px;border-radius:7px;border:1px solid var(--line);background:var(--card);padding:0 10px}
textarea{width:100%;min-height:96px;padding:8px 10px;font-size:14px}
input[type=number]{width:84px}
input[type=range]{accent-color:var(--brand);min-height:44px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:0;background:none;flex:1 0 auto;font-weight:500;color:var(--mut);border-bottom:2px solid transparent;padding:0 12px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.pane{padding:16px;display:none}.pane.on{display:block}
.pane h3{margin:18px 0 8px;font-size:14px;font-weight:600;text-transform:none}.pane h3:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.row>label:first-child{font-size:13px;color:var(--mut);min-width:8em}
.unit{font-size:13px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin:6px 0 12px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:4px;margin:10px 0}
.slots button{padding:4px;min-height:50px;color:#fff;border:0;border-radius:5px;font-size:12px;line-height:1.25;position:relative;font-weight:500}
.slots button small{display:block;font-weight:700;font-size:11px;letter-spacing:.03em}
.slots button i{position:absolute;top:2px;right:4px;font-style:normal;font-size:9px;opacity:.9}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.lvocc{flex-wrap:wrap;gap:6px}.lvocc input[type=number]{width:74px}.lvg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.lvk{color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;letter-spacing:.02em}
.seg button{font-size:13px;padding:0 10px}
.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.seg.lv button.on[data-sc=low]{background:var(--low);border-color:var(--low)}.seg.lv button.on[data-sc=mod]{background:var(--mod);border-color:var(--mod)}.seg.lv button.on[data-sc=busy]{background:var(--busy);border-color:var(--busy)}
.blist{list-style:none;margin:10px 0 0;padding:0;max-height:360px;overflow:auto}
.blist li{display:grid;grid-template-columns:58px minmax(0,1fr) auto auto 44px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.blist li.dh{display:block;font-weight:600;font-size:13px;color:var(--mut);border-top:0;padding:10px 0 2px}
.blist time{font:600 16px Inter,sans-serif;white-space:nowrap}
.blist a{font-size:13px;color:var(--brand2);white-space:nowrap}
.blist .called{opacity:.55}
.warn{color:var(--busy);font-size:12.5px;display:block}
.ok{color:var(--good);font-size:12.5px;display:block}
.rec{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:14px;margin-top:10px}
.toggle{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:8px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.toggle span small{display:block;color:var(--mut);font-size:12.5px}
.hist{display:flex;align-items:flex-end;gap:2px;height:80px;margin:8px 0 4px;border-bottom:1px solid var(--line)}
.hist div{flex:1;background:var(--brand);border-radius:2px 2px 0 0;min-height:1px;opacity:.85}
.histx{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.mrow{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;align-items:end}
.mrow label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);gap:2px}
.mrow input,.mrow select{width:100%}
.mrow .nm{grid-column:1/-1;display:flex;gap:8px}.mrow .nm input{flex:1;font-weight:600}
.mrow .w2{grid-column:span 2}.mrow .wall{grid-column:1/-1}
.mrow .win{display:flex;gap:6px;align-items:center}.mrow .win input{flex:1;padding:0 6px}
.days7{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.days7 button{min-width:40px;min-height:40px;padding:0 6px;font-size:13px}
.days7 button.on{background:var(--off);color:#fff;border-color:var(--off)}
.adays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:6px 0 10px}
.adays label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);text-align:center;gap:2px}
.adays input{width:100%;padding:0 4px;text-align:center}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--mut);margin:8px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
h2{font:700 clamp(21px,2.4vw,26px)/1.2 Inter,"Noto Sans HK",sans-serif;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h3.sub{font-size:16px;font-weight:600;margin:28px 0 6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12.5px}
th:first-child,td:first-child{text-align:left}
tr.click{cursor:pointer}tr.sel td{background:var(--soft);font-weight:600}
.pill{color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;letter-spacing:.02em}
.scroll{overflow-x:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;text-align:left;min-height:auto;display:block;width:100%;font-weight:400}
.card.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.card dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;margin:10px 0 0;font-size:13.5px}
.card dt{color:var(--mut)}.card dd{margin:0;text-align:right;font-weight:600;white-space:nowrap}
.card .big{font:600 28px/1 Inter,sans-serif;display:block;margin-top:10px;letter-spacing:-.02em}
.report{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,2.4vw,28px)}
.rhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font:700 44px/1 Inter,sans-serif;letter-spacing:-.03em}
.score span{font-size:13px;color:var(--mut)}
.rmet{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:16px 0}
.rmet div{padding:10px 12px 10px 0}
.rmet b{display:block;font-size:19px;font-weight:600}.rmet span{font-size:12.5px;color:var(--mut)}
.find{margin:0;padding-left:18px}.find li{margin:4px 0}
.recs td{white-space:normal;vertical-align:top}.recs td:nth-child(2),.recs th:nth-child(2){text-align:left}.recs td.n{white-space:nowrap}
.recs small{display:block;color:var(--mut);font-size:12.5px}
.pos{color:var(--good);font-weight:600}.neg{color:var(--busy);font-weight:600}
.roster{table-layout:fixed;min-width:820px}.roster th:first-child{width:8.5em}.roster td,.roster th{text-align:center;padding:4px;white-space:normal}
.roster td:first-child,.roster th:first-child{text-align:left;padding-left:0}
.roster td button{min-height:38px;width:100%;font-size:12px;padding:0 4px;line-height:1.2;font-weight:500}
.roster td button.off{background:var(--soft);color:var(--mut);border-style:dashed}
.roster td button.ex{border-color:var(--brand);color:var(--brand2);font-weight:600}
.roster th.we{color:var(--ink)}.roster th.sel{background:var(--soft)}
.roster small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.gantt{display:grid;grid-template-columns:8em minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13.5px}
.gantt .track{position:relative;height:20px;background:var(--soft);border-radius:4px}
.gantt .bar{position:absolute;top:0;bottom:0;border-radius:4px;color:#fff;font-size:11px;padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.gantt .cov{position:absolute;top:0;bottom:0;border-right:1px solid var(--card);font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gantt .hrs{text-align:right;color:var(--mut);white-space:nowrap}
.gantt small{display:block;color:var(--mut);font-size:12px}
.axis{position:relative;height:18px;font-size:12px;color:var(--mut)}
.axis span{position:absolute;transform:translateX(-50%)}
.sample{font-size:12.5px;color:var(--mut);margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(10,14,18,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.mcard{background:var(--card);border-radius:12px;padding:20px;width:min(100%,420px);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);margin:10px 0}
.fl input{width:100%}
.mcard .full{width:100%;margin-top:8px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:14px 0 4px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
input[type=email],input[type=password]{min-height:44px;border-radius:7px;border:1px solid var(--line);background:var(--card);padding:0 10px}
@media(max-width:700px){.gantt .cov{font-size:0}}
@media(max-width:600px){table{font-size:12.5px}.clock{font-size:22px}.gantt{grid-template-columns:5.6em minmax(0,1fr) auto;gap:4px 8px;font-size:12.5px}.kpi:first-child{padding-left:14px}.kpi{padding-left:14px}}
</style>
</head>
<body>
<header class="band top">
 <div class="wrap">
  <div class="tophead"><div class="brandmark"><i aria-hidden="true"></i><h1 data-i="title"></h1></div><div style="display:flex;gap:8px;flex:none"><button id="acct" hidden></button><button class="lang" id="lang">English</button></div></div>
  <p data-i="sub"></p>
  <span class="scope" id="scope"></span> <span class="scope" id="sync"></span>
  <div class="kpis" id="kpis"></div>
 </div>
</header>
<div id="authBox" class="modal" hidden><div class="mcard" role="dialog" aria-modal="true" aria-labelledby="authT">
 <div class="rhead"><h2 id="authT" data-i="auTitle"></h2><button id="auClose" aria-label="×">×</button></div>
 <div id="auOut">
  <form id="auForm">
   <div class="seg" id="auMode" style="margin-top:6px"><button type="button" data-m="login" class="on" data-i="auLogin"></button><button type="button" data-m="signup" data-i="auSignup"></button></div>
   <label class="fl">Email<input type="email" id="auEmail" required autocomplete="email"></label>
   <label class="fl"><span data-i="auPw"></span><input type="password" id="auPw" required minlength="8" autocomplete="current-password"></label>
   <button class="pri full" type="submit" id="auGo"></button>
   <button class="full" type="button" id="auForgot" data-i="auForgot"></button>
  </form>
  <div class="or" data-i="auOr"></div>
  <button class="full" type="button" id="auGoogle" data-i="auGoogle"></button>
 </div>
 <div id="auIn" hidden><p id="auWho" style="margin:10px 0"></p><button class="full" id="auLogout" data-i="auLogout"></button></div>
 <div id="auReset" hidden><label class="fl"><span data-i="auNewPw"></span><input type="password" id="auNew" minlength="8" autocomplete="new-password"></label><button class="pri full" id="auSetPw" data-i="auSetPw"></button></div>
 <p class="note" id="auMsg" role="status"></p>
 <p class="note" data-i="auNote"></p>
</div></div>

<section class="band">
 <div class="wrap main">
  <div class="stage">
   <div class="hud">
    <span class="clock" id="clock">18:00</span>
    <span class="badge" id="lvBadge"></span>
    <span class="chip" id="hudDay"></span>
    <span class="chip" id="hudSeat"></span><span class="chip" id="hudTab"></span>
    <span class="chip" id="hudQ"></span>
    <span class="chip" id="hudMode" data-i="editing" hidden></span>
    <button class="sm" id="heat" data-i="heat"></button>
   </div>
   <div class="cvbox" id="cvbox"><canvas id="cv"></canvas></div>
   <div class="ctrl">
    <input type="range" id="tl" data-ia="time">
    <button class="pri" id="play"></button>
    <div class="seg" id="speed"><button data-v="2">1×</button><button data-v="6" class="on">3×</button><button data-v="20">10×</button><button data-v="90">45×</button></div>
    <button class="ff" id="skip" data-i="skip"></button>
   </div>
   <div class="cvlegend"><span><i style="background:#0b5d63"></i><span data-i="lgDining"></span></span><span><i style="background:#c9c3b8"></i><span data-i="lgDirty"></span></span><span><svg width="12" height="12" viewBox="-6 -6 12 12" style="margin-right:5px;vertical-align:-1px" aria-hidden="true"><circle cy="-2.6" r="2.7" fill="#c2483b"/><path d="M-4.6 5.4V3.6A4.6 3.6 0 0 1 4.6 3.6V5.4Z" fill="#c2483b"/></svg><span data-i="lgWaiting"></span></span><span><i style="background:#15181c"></i><span data-i="lgStaff"></span></span></div>
   <div class="sample" data-i="sample"></div>
  </div>

  <div class="panel">
   <div class="tabs" role="tablist">
    <button class="on" data-tab="flow" data-i="tFlow"></button>
    <button data-tab="menu" data-i="tMenu"></button>
    <button data-tab="book" data-i="tBook"></button>
    <button data-tab="staff" data-i="tStaff"></button>
    <button data-tab="cost" data-i="tCost"></button>
    <button data-tab="extra" data-i="tExtra"></button>
    <button data-tab="layout" data-i="tLayout"></button>
   </div>

   <div class="pane on" id="p-flow">
    <div class="row"><label for="date" data-i="date"></label><input type="date" id="date"><span class="unit" id="dayName"></span></div>
    <div class="row"><label data-i="range"></label><div class="seg" id="range"><button data-r="day" data-i="rDay"></button><button data-r="week" data-i="rWeek"></button><button data-r="month" data-i="rMonth"></button></div></div>
    <div class="row"><label data-i="hours"></label><input type="time" id="open" data-ia="open"><span class="unit" data-i="to"></span><input type="time" id="close" data-ia="close"></div>
    <div class="row"><label for="slot" data-i="slotLen"></label><select id="slot"><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option></select></div>
    <h3 data-i="scenEditH"></h3>
    <div class="seg lv" id="scenSeg"><button data-sc="low">LOW</button><button data-sc="mod">MODERATE</button><button data-sc="busy">BUSY</button></div>
    <p class="note" data-i="scenEditNote"></p>

const DEV=(()=>{try{let d=localStorage.getItem('dr-dev');if(!d){d=Math.random().toString(36).slice(2);localStorage.setItem('dr-dev',d)}return d}catch(e){return Math.random().toString(36).slice(2)}})();
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
function setSync(k){const el=$('#sync');el.textContent=tr(k,nowT());el.dataset.k=k}
const exportJSON=withBg=>{const c={...S};if(!withBg||(c.bg&&c.bg.length>240000))delete c.bg;return JSON.stringify({app:'DinnerRush',v:3,state:c})};
let cloudBusy=false,cloudDirty=false;
async function pushCloud(){if(!cloud)return;if(cloudBusy){cloudDirty=true;return}cloudBusy=true;setSync('sySyncing');
 try{const c={...S};delete c.bg;if(cloud.kind==='net'){const img=S.bg&&S.bg.length<6e6?S.bg:'',body={v:S._t||Date.now(),dev:DEV,s:JSON.stringify(c)};if(cloud.bgSent!==img){body.bg=img;body.bgv=Date.now()}
  await api('PUT',body);if(body.bg!==undefined){cloud.bgSent=img;cloud.bgv=body.bgv}setSync('sySynced');cloudBusy=false;if(cloudDirty){cloudDirty=false;pushCloud()}return}
  await cloud.ref.set({v:S._t||Date.now(),dev:DEV,s:JSON.stringify(c)});
  const img=S.bg&&S.bg.length<240000?S.bg:'';if(cloud.bgSent!==img){await cloud.bgRef.set({v:S._t||Date.now(),dev:DEV,img});cloud.bgSent=img}setSync('sySynced')}
 catch(e){setSync(e&&e.status===403?'syDenied':'syErr')}cloudBusy=false;if(cloudDirty){cloudDirty=false;pushCloud()}}
function applyState(o,t){const bg=S.bg;applying=true;try{S={...defaults(o.lang),...o};if(bg&&!S.bg)S.bg=bg;fixS();if(t)S._t=t;viewDate=S.date;
 if(S.bg&&S.bg!==bg){bgImg=new Image();bgImg.src=S.bg}initInputs();applyLang();renderMenus();renderStaffList();renderAutoDays();renderPeriods();renderCosts();changed()}finally{applying=false}}
async function initSync(){setSync('syLocal');try{if(!window.claude||typeof window.claude.use!=='function')return;const db=await window.claude.use('db'),user=await window.claude.use('user');if(!db||!user)return;const id=await user.id();if(!id)return;
 const ref=db.doc('data/users/'+id+'/state'),bgRef=db.doc('data/users/'+id+'/floorplan');cloud={ref,bgRef,bgSent:null};setSync('sySyncing');
 const first=await ref.get();
 if(first.exists){const d=first.data();if((d.v||0)>(S._t||0)){applyState(JSON.parse(d.s),d.v);setSync('sySynced')}else if((S._t||0)>(d.v||0))await pushCloud();else setSync('sySynced')}else await pushCloud();
 try{const b=await bgRef.get();if(b.exists){const bd=b.data();cloud.bgSent=bd.img||'';if(bd.img&&bd.img!==S.bg&&(bd.v||0)>=(S._t||0)-5000){S.bg=bd.img;bgImg=new Image();bgImg.src=S.bg;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}}}catch(e){}
 ref.onSnapshot(sn=>{if(!sn.exists)return;const d=sn.data();if(d.dev!==DEV&&(d.v||0)>(S._t||0)){try{applyState(JSON.parse(d.s),d.v);setSync('sySynced')}catch(e){}}},()=>setSync('syErr'));
 bgRef.onSnapshot(sn=>{if(!sn.exists)return;const d=sn.data();if(d.dev===DEV)return;const img=d.img||'';if(img!==(S.bg||'')){S.bg=img||null;bgImg=img?Object.assign(new Image(),{src:img}):null;cloud.bgSent=img;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}},()=>{});
 }catch(e){setSync(cloud?'syErr':'syLocal')}}

function stopNet(){clearInterval(netTimer);netTimer=null}
async function netPull(withBg){const d=await api('GET',null,withBg?'?bg=1':'');return d||{}}
async function startNet(){cloud={kind:'net',bgSent:null,bgv:null};setSync('sySyncing');
 try{const d=await netPull(true);
  if(d.s&&(d.v||0)>(S._t||0)){applyState(JSON.parse(d.s),d.v);if(typeof d.bg==='string'){S.bg=d.bg||null;bgImg=d.bg?Object.assign(new Image(),{src:d.bg}):null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}cloud.bgSent=d.bg||'';cloud.bgv=d.bgv||null;setSync('sySynced')}
  else{cloud.bgSent=typeof d.bg==='string'?d.bg:null;cloud.bgv=d.bgv||null;if(!d.s||(S._t||0)>(d.v||0)){if(!S._t)S._t=Date.now();await pushCloud()}else setSync('sySynced')}
 }catch(e){setSync(e&&e.status===403?'syDenied':'syErr');if(e&&e.status===403){cloud=null;return}}
 stopNet();netTimer=setInterval(netPoll,30000)}
async function netPoll(){if(!cloud||cloud.kind!=='net'||document.hidden||cloudBusy)return;
 try{const d=await netPull(false);if(d.s&&d.dev!==DEV&&(d.v||0)>(S._t||0)){applyState(JSON.parse(d.s),d.v);setSync('sySynced')}
  if(d.bgv&&d.bgv!==cloud.bgv){const b=await netPull(true);S.bg=b.bg||null;bgImg=b.bg?Object.assign(new Image(),{src:b.bg}):null;cloud.bgSent=b.bg||'';cloud.bgv=b.bgv;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)netPoll()});
